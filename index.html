<!doctype html>
<html>
    <head>
        <title>Příběhy 2</title>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <style>
            @font-face {
                font-family: Pixelbasel;
                src: url("assets/departure.woff2");
            }
            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                height: 100%;
                width: 100%;
            }
            * {
                font-family: Pixelbasel;
                font-size: 18px;
                font-size: inherit;
                font-smooth: never;
                -webkit-font-smoothing: none;
                -moz-osx-font-smoothing: none;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
                -ms-user-select: none;
            }
            #ui {
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                bottom: 0;
                z-index: 50;
            }
            #joystick-container {
                position: absolute;
                left: 0;
                right: 0;
                top: 50%;
                bottom: 0;
            }
            #joystick {
                z-index: 1;
                position: absolute;
                left: 50%;
                top: 70%;
                opacity: 0.6;
                overflow: visible;
            }
            #text {
                z-index: 5;
                position: absolute;
                top: 20px;
                left: 25px;
                right: 25px;
                height: fit-content;
                image-rendering: pixelated;
                text-align: center;
                max-height: 25%;
                overflow-y: scroll;
                overflow-x: hidden;
                overscroll-behavior-y: none;
            }
            #text:has(span:not(:empty)) {
                padding: 10px;
                background-color: #e0e0e0;
                border-radius: 3px;
            }
            #content {
                z-index: 100;
                display: flex;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
            }
            #content:empty {
                display: none;
                pointer-events: none;
            }
            #answers {
                z-index: 10;
                position: absolute;
                bottom: 45px;
                left: 0;
                right: 0;
                padding: 10px;
                display: flex;
                flex-direction: column;
                justify-self: center;
                width: 85%;
                max-width: 500px;
            }
            button {
                margin: 0.15rem;
                border: none;
                border-radius: 3px;
                cursor: pointer;
                padding: 10px;
            }
            button {
                background-color: #d0d0d0;
            }
            button.active {
                background-color: #b3b3b3;
            }
            button.pressed {
                background-color: #b3b3b3;
            }
            #intro {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #efefef;
                z-index: 500;
            }
            #intro-panel {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                max-width: 400px;
                width: 80%;
            }
            #intro-panel * {
                width: 100%;
            }
            .title {
                font-size: 52px;
                text-align: center;
            }
            .subtitle {
                font-size: 14px;
                color: #888888;
                margin-bottom: 15px;
                text-align: center;
            }
            #settings {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 1000;
                background-color: #efefef;
                display: none;
                justify-content: center;
                align-items: center;
            }
            #settings-panel {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                max-width: 400px;
                width: 80%;
            }
            #settings-panel * {
                width: 100%;
            }
            #overlay {
                position: absolute;
                font-size: 15px;
                z-index: 10000;
                background-color: #efefef80;
                border-radius: 0 0 3px 0;
                padding: 1px;
            }
        </style>
        <script type="module" src="script.js"></script>
        <script src="log.js" defer></script>
    </head>
    <body>
        <div id="overlay">
            <span id="version">v0.0.0</span>
            <span id="fps">fps: 60</span>
        </div>
        <div style="z-index: 10000; position: absolute; bottom: 0">
            <button onpointerdown="location.reload()" style="padding: 10px">
                reload
            </button>
            <button
                onpointerdown="(location.search.includes('debug')) ? location.search=location.search.replace('debug', '') : location.search+='&debug'"
                style="padding: 10px"
            >
                debug
            </button>
            <button
                onpointerdown="(location.search.includes('pixelart')) ? location.search=location.search.replace('pixelart', '') : location.search+='&pixelart'"
                style="padding: 10px"
            >
                pixelart
            </button>
        </div>
        <div id="intro">
            <div id="intro-panel">
                <span id="intro-title" class="title">Příběhy 2</span>
                <span id="intro-subtitle" class="subtitle"
                    >[vložte nějakou vtipnou hlášku]</span
                >
                <button id="start">start</button>
                <button id="open-settings">nastavení</button>
                <button id="reload" onclick="location.reload()">reload</button>
            </div>
            <script>
                const subtitles = [
                    "Vyrobeno ve 3.G/4.G/5.G/...",
                    "42",
                    "73",
                    "5381",
                    "cat /dev/zero | sudo tee /dev/sda",
                    "[nic tu není]",
                    "' OR 1=1 --",
                    "Tomateve!",
                    "Byli jste varováni!",
                    "Dobrý večer milé děti",
                    "Jsou tu nějaké easter eggs?",
                    "Už znáte originální Příběhy?",
                    "[vložte nějakou vtipnou hlášku]",
                    "Micro$oft sucks",
                ];

                document.getElementById("intro-subtitle").innerHTML =
                    subtitles[Math.floor(Math.random() * subtitles.length)];
            </script>
        </div>
        <div id="settings">
            <div id="settings-panel">
                <span id="settings-title" class="title">Nastavení</span>
                <span id="settings-subtitle" class="subtitle"
                    >Změň si, co jen chceš</span
                >
                <button id="toggle-showfps">ukazovat fps</button>
                <button id="toggle-showversion">ukazovat verzi</button>
                <button id="close-settings">zpět</button>
            </div>
        </div>
        <div id="ui">
            <div id="text">
                <span id="text-visible" style="white-space: pre-wrap"></span
                ><span
                    id="text-invisible"
                    style="white-space: pre-wrap; visibility: hidden"
                ></span>
            </div>
            <div id="answers"></div>
            <div id="content"></div>
            <button
                id="interact"
                onclick="main.player.interact()"
                disabled
                style="
                    padding: 10px;
                    z-index: 10;
                    position: absolute;
                    bottom: 0;
                    right: 0;
                "
            >
                interact
            </button>
            <div id="joystick-container">
                <svg id="joystick">
                    <circle
                        id="joystick-base"
                        cx="0"
                        cy="0"
                        r="70"
                        fill="#555555"
                    />
                    <circle
                        id="joystick-stick"
                        cx="0"
                        cy="0"
                        r="35"
                        fill="#bbbbbbbb"
                    />
                </svg>
            </div>
        </div>
        <script>
            var gameVersion = "0.0.0";
            fetch("./version.txt")
                .then((response) => response.text())
                .then((text) => {
                    gameVersion = text.trim();
                    document.getElementById("version").textContent =
                        "v" + gameVersion;
                })
                .catch((err) => {
                    console.error(err);
                });
            window.params = new URLSearchParams(location.search);
        </script>
    </body>
</html>
